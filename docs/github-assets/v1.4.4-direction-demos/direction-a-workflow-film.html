<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>方向 A · 工作流电影感</title>
  <style>
    :root { --ink:#17263b; --paper:#f5f2ec; --line:#c8c2b8; --plan:#435f91; --warm:#b88139; }
    * { box-sizing:border-box; } body { margin:0; min-width:1440px; background:var(--paper); color:var(--ink); font-family:"Microsoft YaHei UI","PingFang SC",sans-serif; }
    .canvas { width:1920px; height:1080px; overflow:hidden; position:relative; padding:72px 90px; background:radial-gradient(circle at 84% 10%,#fffdf8 0 16%,transparent 42%),var(--paper); }
    .eyebrow { font-size:18px; letter-spacing:.16em; color:#667181; font-weight:700; } h1 { width:450px; margin:18px 0 0; font:700 64px/1.13 "Songti SC","STSong",serif; letter-spacing:-.05em; } .lede { width:405px; font-size:20px; line-height:1.6; margin:20px 0; color:#42516a; }
    .route { position:absolute; top:458px; left:90px; display:grid; gap:13px; width:315px; } .route div { display:flex; align-items:center; gap:17px; font-size:18px; font-weight:700; } .route b { width:34px; height:34px; border:1px solid var(--ink); border-radius:50%; display:grid; place-items:center; font:600 16px Georgia; } .route div:nth-child(2) b{background:var(--plan);color:white;border-color:var(--plan)} .route div:nth-child(3) b{background:var(--warm);color:white;border-color:var(--warm)}
    .frame { position:absolute; right:76px; top:138px; width:1290px; height:814px; background:white; border:1px solid rgba(23,38,59,.25); border-radius:22px; box-shadow:0 30px 60px rgba(23,38,59,.14); padding:12px; transform:rotate(-1.5deg); } .frame img { width:100%; height:100%; object-fit:cover; object-position:center; border-radius:12px; display:block; }
    .callout { position:absolute; right:102px; top:118px; background:var(--ink); color:white; padding:16px 22px; font-size:20px; font-weight:700; letter-spacing:.03em; } .note { position:absolute; left:90px; bottom:135px; font:600 18px/1.5 "Songti SC",serif; width:395px; padding-left:20px; border-left:3px solid var(--warm); }
    .label { position:absolute; left:90px; bottom:74px; font-size:16px; letter-spacing:.12em; color:#7a7c7e; }
  </style>
</head>
<body><main class="canvas">
  <div class="eyebrow">DIRECTION A · NARRATIVE WORKFLOW FILM</div>
  <h1>从一句任务，<br>走到可控执行。</h1>
  <p class="lede">让 GIF 只讲一条人能复述的路径：提出任务、看见计划、确认后再执行。完整窗口始终是主角。</p>
  <div class="route"><div><b>1</b>提出真实任务</div><div><b>2</b>生成结构化计划</div><div><b>3</b>确认后再行动</div></div>
  <div class="frame"><img src="assets/apple-pi-full-workflow.png" alt="Apple Pi 完整工作区与计划列表"></div>
  <div class="callout">真实完整窗口 · 计划待确认</div><div class="note">镜头会从完整工作区开始，在计划列表处推近，再回到全景谢幕；不是把几个静态局部拼成“演示”。</div><div class="label">真实隔离实例 · 无个人项目、会话或凭证</div>
</main></body></html>
