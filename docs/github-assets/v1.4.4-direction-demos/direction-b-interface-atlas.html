<body><main class="canvas"><div class="kicker">DIRECTION B · INTERFACE ATLAS</div><h1>所有关键上下文，<br>都在同一个窗口。</h1><p class="intro">把完整界面作为证据，再用同一张真实截图的局部镜头讲清工作流：左侧任务、主对话、计划和执行控制彼此可见。</p><p class="tiny">GIF 采用“完整窗口 → 计划局部 → 底部控制 → 完整窗口”的巡览结构。所有局部都是同一真实窗口的高清裁切，不是重画的 UI。</p><div class="proof"><strong>适合 README 的“先看懂，再细看”结构。</strong><p>静态截图先证明它是完整桌面工作区；动画再按区域导览，避免用户只看到一块悬浮面板。</p></div><section class="grid"><article class="tile full"><img src="assets/apple-pi-full-workflow.png" alt="完整 Apple Pi 工作区"><span class="tag">01 · 完整桌面工作区</span></article><article class="tile plan"><img src="assets/apple-pi-full-workflow.png" alt="计划列表局部"><span class="tag">02 · 可见的计划与确认</span></article><article class="tile controls"><img src="assets/apple-pi-full-workflow.png" alt="输入与控制栏局部"><span class="tag">03 · 权限与计划策略</span></article></section></main></body></html>
